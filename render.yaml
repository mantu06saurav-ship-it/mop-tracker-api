services:
  - type: web
    name: mop-tracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_MINUTES
        value: "480"
      - key: DB_SERVER
        sync: false
      - key: DB_PORT
        value: "1433"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_ODBC_DRIVER
        value: "ODBC Driver 18 for SQL Server"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: "MOP Tracker"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: mop-tracker-web
          envVarKey: RENDER_EXTERNAL_URL
  - type: web
    name: mop-tracker-web
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: mop-tracker-api
          envVarKey: RENDER_EXTERNAL_URL
